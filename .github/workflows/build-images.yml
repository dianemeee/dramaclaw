# Build the fork's api + frontend images and push them to GHCR.
#
# Why this exists: 1Panel cannot build from a git repo, so the fork's
# language recode reaches the VPS as images. Every push to `main`
# builds `ghcr.io/<owner>/dramaclaw-api:latest-id` and
# `ghcr.io/<owner>/dramaclaw-frontend:latest-id`, which Watchtower (or a
# 1Panel cron) on the VPS pulls and recreates. The gateway image is
# NOT built here — it comes from the separate dramaclaw-gateway repo
# and is unchanged by the language recode.
#
# The upstream release workflow (.github/workflows/release-images.yml)
# pushes to Docker Hub as claymorelab/*; this one pushes to GHCR under
# the fork owner's namespace so it never collides with upstream tags.
#
# Platforms: linux/amd64 only — the VPS is x86_64. Add linux/arm64 to
# the platforms list if an ARM host is ever needed.

name: build-images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/dramaclaw-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/dramaclaw-frontend

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=raw,value=latest-id
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=raw,value=latest-id
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_APP_VERSION=latest-id
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
